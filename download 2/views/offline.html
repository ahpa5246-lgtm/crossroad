<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>غير متصل — مفترق الطرق</title>
<style>
  :root { --green:#7c411a; --gold:#bf9627; --bg:#f5f0eb; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI',Tahoma,Arial,sans-serif; background:var(--bg); display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
  .card { background:#fff; border-radius:24px; padding:48px 40px; max-width:480px; width:100%; text-align:center; box-shadow:0 8px 40px rgba(0,0,0,.10); }
  .icon { font-size:72px; margin-bottom:24px; animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  h1 { font-size:26px; color:var(--green); font-weight:700; margin-bottom:12px; }
  p  { font-size:15px; color:#666; line-height:1.7; margin-bottom:24px; }
  .dots { display:flex; justify-content:center; gap:8px; margin-bottom:32px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--green); opacity:.3; animation:blink 1.4s ease-in-out infinite; }
  .dot:nth-child(2){animation-delay:.2s} .dot:nth-child(3){animation-delay:.4s}
  @keyframes blink { 0%,80%,100%{opacity:.3} 40%{opacity:1} }
  .btn { display:inline-flex; align-items:center; gap:8px; background:var(--green); color:#fff; padding:12px 28px; border-radius:12px; border:none; font-size:15px; font-weight:600; cursor:pointer; text-decoration:none; transition:opacity .2s; }
  .btn:hover { opacity:.88; }
  .status { margin-top:20px; font-size:13px; color:#999; }
  .status.online { color:var(--green); font-weight:600; }
</style>
</head>
<body>
<div class="card">
  <div class="icon"></div>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>يبدو أنك غير متصل حاليا. تحقق من اتصالك بالإنترنت وحاول مجددا.</p>
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <a href="/" class="btn" onclick="location.reload();return false"> إعادة المحاولة</a>
  <div class="status" id="statusMsg">يتحقق من الاتصال...</div>
</div>
<script>
function checkOnline() {
  var el = document.getElementById('statusMsg');
  if (navigator.onLine) {
    el.textContent = ' تم استعادة الاتصال! جاري التحديث...';
    el.className = 'status online';
    setTimeout(function() { location.href = '/'; }, 1200);
  } else {
    el.textContent = 'لا يزال غير متصل...';
    el.className = 'status';
  }
}
window.addEventListener('online', checkOnline);
setInterval(checkOnline, 5000);
checkOnline();
</script>
</body>
</html>
