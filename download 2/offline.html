<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>غير متصل — مفترق الطرق</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#7c411a;--gold:#cfab46;--bg:#fff9f0}
@media(prefers-color-scheme:dark){
:root{--navy:#7c411a;--gold:#debe67;--bg:#1a1a1a}
body{background:var(--bg);color:#e0e0e0}
.card{background:#2a2a2a}
p{color:#a0a0a0}
}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;direction:rtl}
.card{background:#fff;border-radius:20px;padding:48px 40px;max-width:440px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.1)}
.icon{font-size:72px;margin-bottom:24px;display:block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
h1{font-size:24px;font-weight:700;color:var(--green);margin-bottom:10px}
p{color:#666;font-size:15px;line-height:1.6;margin-bottom:28px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;border:none;border-radius:12px;padding:13px 28px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;transition:opacity .2s}
.btn:hover{opacity:.9}
.status{margin-top:20px;font-size:12px;color:#999;display:flex;align-items:center;justify-content:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#e74c3c;display:inline-block}
.dot.online{background:#27ae60}
</style>
</head>
<body>
<div class="card">
  <span class="icon"></span>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>يبدو أنك غير متصل بالإنترنت. تحقق من اتصالك وحاول مرة أخرى.</p>
  <button class="btn" onclick="tryReload()">
    <span></span> إعادة المحاولة
  </button>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">غير متصل</span>
  </div>
</div>
<script src="/public/js/offline.js"></script>
</body>
</html>
